[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi-pipeline"
version = "0.1.0"
description = "Hyperspectral capture processing: radiometric correction, co-registration, RGB synthesis, cloud mask."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "tifffile>=2024.8",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hsi-pipeline = "hsi_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D", "NPY", "SIM"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"